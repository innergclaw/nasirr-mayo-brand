name: Sync Market Pulse interface
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: sync-watchlist
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node automation/sync-watchlist.mjs
      - run: node --test watchlist-route.test.mjs
      - name: Save changed interface and request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add watchlist
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync public Market Pulse interface'
          git push
          gh api --method POST repos/${{ github.repository }}/pages/builds
