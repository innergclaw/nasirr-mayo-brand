name: Sync Market Pulse interface
on:
  # Primary trigger: innerg-watchlist "Deploy public charts" sends this after
  # the public data is live.
  repository_dispatch:
    types: [market-pulse-updated]
  schedule:
    # Intraday hourly refresh plus a late fallback for the close.
    - cron: '17 9-18 * * 1-5'
      timezone: 'America/New_York'
    - cron: '30 21 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:
  pull_request:
permissions:
  contents: write
  pages: write
concurrency:
  group: sync-watchlist
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test automation/closing-snapshot.test.mjs
      - run: node automation/sync-watchlist.mjs
      - run: node --test watchlist-route.test.mjs automation/closing-snapshot.test.mjs
      - name: Save changed interface and request Pages build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add watchlist
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync public Market Pulse interface'
          git push
          gh api --method POST repos/${{ github.repository }}/pages/builds
